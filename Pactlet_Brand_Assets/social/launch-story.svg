</defs><rect x="0" y="0" width="1080" height="1920" rx="0" fill="url(#bg)"/><rect x="0" y="0" width="1080" height="1920" rx="0" fill="url(#grid)"/><ellipse cx="680" cy="1260" rx="650" ry="650" fill="url(#glow)"/><ellipse cx="1110" cy="450" rx="400" ry="400" fill="url(#pglow)"/><g transform="translate(90 119) scale(0.74)" opacity="1"><path d="M22 17 H62 Q77 17 77 32 V38 Q77 53 62 53 H35 Q20 53 20 68 V83" fill="none" stroke="#CBFF69" stroke-width="21" stroke-linecap="round" stroke-linejoin="round"/></g><text x="174" y="155" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="700" fill="#F7F8FA" text-anchor="start" letter-spacing="-1.4">Pactlet</text><rect x="92" y="270" width="385.2" height="38" rx="19" fill="#14221D" stroke="#CBFF69" stroke-width="1" opacity="0.98"/><text x="111" y="295" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#CBFF69" text-anchor="start">THE FUTURE OF AGENT PAYMENTS</text><text x="90" y="478" font-family="Inter, Arial, sans-serif" font-size="103" font-weight="750" fill="#F7F8FA" text-anchor="start" letter-spacing="-3">Let agents</text><text x="90" y="598" font-family="Inter, Arial, sans-serif" font-size="103" font-weight="750" fill="#F7F8FA" text-anchor="start" letter-spacing="-3">pay.</text><text x="90" y="718" font-family="Inter, Arial, sans-serif" font-size="103" font-weight="750" fill="#CBFF69" text-anchor="start" letter-spacing="-3">You set</text><text x="90" y="838" font-family="Inter, Arial, sans-serif" font-size="103" font-weight="750" fill="#CBFF69" text-anchor="start" letter-spacing="-3">the limits.</text><text x="94" y="1040" font-family="Inter, Arial, sans-serif" font-size="33" font-weight="500" fill="#9DA8B2" text-anchor="start">Budgets, scopes, expiry and delegation</text><text x="94" y="1085" font-family="Inter, Arial, sans-serif" font-size="33" font-weight="500" fill="#9DA8B2" text-anchor="start">for agents that pay through x402.</text><rect x="86" y="1190" width="912" height="478" rx="38" fill="#151D24" stroke="#2A3641" stroke-width="2"/><rect x="144" y="1252" width="792" height="112" rx="22" fill="#203127"/><g transform="translate(176 1289) scale(1.6666666666666667)"><path d="M12 5V13M12 13H5V19M12 13H19V19" fill="none" stroke="#CBFF69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><circle cx="12" cy="4" r="2" fill="#CBFF69"/><circle cx="5" cy="20" r="2" fill="#CBFF69"/><circle cx="19" cy="20" r="2" fill="#CBFF69"/></g><text x="236" y="1307" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="650" fill="#F7F8FA" text-anchor="start">Task authority</text><text x="240" y="1342" font-family="DejaVu Sans Mono, monospace" font-size="23" font-weight="500" fill="#CBFF69" text-anchor="start">100 USDC / 7 days</text><path d="M540 1365V1430M308 1430H777M308 1430V1488M777 1430V1488" fill="none" stroke="#CBFF69" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/><rect x="151" y="1490" width="345" height="115" rx="20" fill="#19242B" stroke="#2A3641" stroke-width="1"/><text x="180" y="1536" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="600" fill="#F7F8FA" text-anchor="start">Research agent</text><text x="180" y="1574" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="500" fill="#CBFF69" text-anchor="start">20 USDC</text><rect x="591" y="1490" width="345" height="115" rx="20" fill="#19242B" stroke="#2A3641" stroke-width="1"/><text x="618" y="1536" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="600" fill="#F7F8FA" text-anchor="start">Trading agent</text><text x="618" y="1574" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="500" fill="#8970FF" text-anchor="start">50 USDC</text><rect x="90" y="1751" width="900" height="88" rx="20" fill="#CBFF69"/><text x="540" y="1806" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="750" fill="#0B1016" text-anchor="middle" letter-spacing="1">DELEGATE TASKS. DEFINE THE LIMITS.</text></svg>